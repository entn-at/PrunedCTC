[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pruned-ctc"
dynamic = ["version"]
description = "Memory-efficient CTC loss with exact vocabulary reduction and pruned alignments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yifan Yang" }]
keywords = ["ctc", "speech-recognition", "pytorch", "sequence-modeling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
dev = ["build>=1.2.2", "ruff>=0.9", "twine>=6"]

[project.urls]
Homepage = "https://github.com/yfyeung/PrunedCTC"
Repository = "https://github.com/yfyeung/PrunedCTC"
Issues = "https://github.com/yfyeung/PrunedCTC/issues"

[tool.setuptools]
py-modules = ["pruned_ctc"]

[tool.setuptools.dynamic]
version = { attr = "pruned_ctc.__version__" }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
